# Render blueprint.
#
# Two services: a Python web service for the Django API and a static site for
# the React build. The database is Supabase PostgreSQL, so no Render database
# is declared — Render's free database expires 30 days after creation and would
# be the wrong home for this data.
#
# Every secret is marked sync:false: Render prompts for it and stores it, and
# no secret value is ever committed to this repository.

services:
  - type: web
    name: document-review-api
    runtime: python
    rootDir: backend
    plan: free
    # Nearest free region to a Supabase project in ap-northeast-2 (Seoul).
    # The default is Oregon, which would put the Pacific between the API and
    # its database on every query. Measured locally, one round trip to Seoul
    # is already ~156ms; from Oregon it would be considerably worse.
    region: singapore
    # Migrations run at build time. Render's free plan has no pre-deploy hook,
    # so this is the supported place for them. They are additive and safe to
    # re-run; the build fails loudly if one fails.
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput"
    # A production server, not runserver.
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # DJANGO_ALLOWED_HOSTS is not listed: settings.py reads Render's own
      # RENDER_EXTERNAL_HOSTNAME, so the service's hostname is picked up
      # automatically rather than pasted in by hand after the fact.
      # The static site's exact origin, never a wildcard. It does not exist
      # until that service is created, so this is set after the first deploy.
      # A bare hostname is accepted: settings.py adds the https scheme.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: submissions
      - key: SUPABASE_SIGNED_URL_TTL
        value: "300"
      - key: DB_HOST
        sync: false      # session pooler host, not the direct host
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

  - type: web
    name: document-review-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    # Client-side routing: every path that is not a real file must serve
    # index.html, or refreshing /review/document/<id> returns 404. Verified
    # locally: without this rule a plain static server 404s on nested routes.
    #
    # NOTE: Render's published docs describe this rule in the dashboard
    # (Action: Rewrite, Source: /*, Destination: /index.html) but do not show
    # the render.yaml keys. Confirm this block applies after the first deploy;
    # if the blueprint rejects it, add the same rule in the dashboard.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false      # the API service's https URL
